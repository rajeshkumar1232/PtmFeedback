server:
  port: 8080

spring:
  application:
    name: ptm-feedback-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ptm_feedback}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ptm:
  auth:
    classteacher-username: ${CLASSTEACHER_USER:classteacher}
    classteacher-password: ${CLASSTEACHER_PASS:classteacher1}
    principal-username: ${PRINCIPAL_USER:principal}
    principal-password: ${PRINCIPAL_PASS:welcome1}
    admin-username: ${ADMIN_USER:admin}
    admin-password: ${ADMIN_PASS:welcome1}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
